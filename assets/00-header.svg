<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="RETRO CYBER PROFILE">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030014"/>
    <stop offset="38%" stop-color="#12002f"/>
    <stop offset="72%" stop-color="#2a003f"/>
    <stop offset="100%" stop-color="#050816"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f5d4"/>
    <stop offset="35%" stop-color="#facc15"/>
    <stop offset="70%" stop-color="#fb7185"/>
    <stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="pinkblue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00f5d4"/>
    <stop offset="55%" stop-color="#fb7185"/>
    <stop offset="100%" stop-color="#facc15"/>
  </linearGradient>
  <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="2" fill="#ffffff" opacity=".055"/>
  </pattern>
  <pattern id="gridPattern" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M52 0 L0 0 0 52" fill="none" stroke="#00f5d4" stroke-width="1" opacity=".28"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="heavyGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>


<style>
  text { font-family: "Courier New", "Fira Code", monospace; }
  .panelFloat { animation: panelFloat 5.5s ease-in-out infinite; transform-origin: center; }
  .scan { animation: scan 3.8s linear infinite; }
  .pulse { animation: pulse 2.3s ease-in-out infinite; transform-origin: center; }
  .flicker { animation: flicker 3.4s linear infinite; }
  .grid { animation: gridMove 8s linear infinite; }
  .dash { stroke-dasharray: 36 18; animation: dash 5.5s linear infinite; }
  .orbit { animation: orbit 9s linear infinite; transform-origin: center; }
  .glitchA { animation: glitchA 3s steps(1) infinite; }
  .glitchB { animation: glitchB 2.7s steps(1) infinite; }
  .blink { animation: blink 1.2s steps(1) infinite; }
  .bar1 { animation: bar 2.4s ease-in-out infinite; transform-origin: left; }
  .bar2 { animation: bar 2.9s ease-in-out infinite; transform-origin: left; }
  .bar3 { animation: bar 3.2s ease-in-out infinite; transform-origin: left; }
  .cube { animation: cube 7s ease-in-out infinite; transform-origin: center; }
  .string { animation: vibe 1.1s ease-in-out infinite; transform-origin: center; }
  .bow { animation: bow 3.2s ease-in-out infinite; transform-origin: center; }
  .chip { animation: chip 4.5s ease-in-out infinite; transform-origin: center; }
  .type1 { animation: typePulse1 6s steps(1) infinite; }
  .type2 { animation: typePulse2 6s steps(1) infinite; }
  .type3 { animation: typePulse3 6s steps(1) infinite; }

  @keyframes panelFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes scan { from{transform:translateY(-120px)} to{transform:translateY(420px)} }
  @keyframes pulse { 0%,100%{opacity:.65;transform:scale(1)} 50%{opacity:1;transform:scale(1.035)} }
  @keyframes flicker { 0%,18%,22%,25%,53%,57%,100%{opacity:1} 20%,24%,55%{opacity:.42} }
  @keyframes gridMove { from{transform:translateY(0)} to{transform:translateY(52px)} }
  @keyframes dash { to{stroke-dashoffset:-240} }
  @keyframes orbit { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes glitchA { 0%,85%,100%{transform:translate(0,0)} 86%{transform:translate(6px,-2px)} 87%{transform:translate(-5px,2px)} 88%{transform:translate(0,0)} }
  @keyframes glitchB { 0%,80%,100%{transform:translate(0,0)} 81%{transform:translate(-7px,1px)} 82%{transform:translate(5px,-1px)} 83%{transform:translate(0,0)} }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.18} }
  @keyframes bar { 0%,100%{transform:scaleX(.35)} 50%{transform:scaleX(1)} }
  @keyframes cube { 0%,100%{transform:skewY(-5deg) rotate(0deg)} 50%{transform:skewY(5deg) rotate(5deg)} }
  @keyframes vibe { 0%,100%{transform:translateX(0)} 50%{transform:translateX(1.8px)} }
  @keyframes bow { 0%,100%{transform:translateX(-12px) rotate(-4deg)} 50%{transform:translateX(16px) rotate(5deg)} }
  @keyframes chip { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-7px) rotate(1.5deg)} }
  @keyframes typePulse1 { 0%,25%{opacity:1} 26%,100%{opacity:.35} }
  @keyframes typePulse2 { 0%,30%{opacity:.35} 31%,60%{opacity:1} 61%,100%{opacity:.35} }
  @keyframes typePulse3 { 0%,62%{opacity:.35} 63%,92%{opacity:1} 93%,100%{opacity:.35} }
</style>

<rect width="1200" height="440" fill="url(#bg)"/>
<rect width="1200" height="440" fill="url(#scanlines)"/>
<g class="grid"><rect x="0" y="280" width="1200" height="220" fill="url(#gridPattern)" opacity=".45"/></g>
<g class="panelFloat">
  <rect x="45" y="35" width="1110" height="370" rx="26" fill="#050816" opacity=".76" stroke="#00f5d4" stroke-width="2.4"/>
  <rect x="68" y="58" width="1064" height="324" rx="18" fill="none" stroke="#fb7185" stroke-width="1.3" opacity=".72"/>
  <path class="dash" d="M92 92 H1108 M92 350 H1108" stroke="#facc15" stroke-width="2" opacity=".8"/>
</g>
<g filter="url(#glow)">
  <text x="100" y="87" font-size="19" fill="#00f5d4" letter-spacing="4" class="flicker">RETRO CYBER PROFILE</text>
  <text x="100" y="119" font-size="13" fill="#fef3c7" letter-spacing="2">animated header // violin synthwave // 3D terminal mood</text>
  <circle class="pulse" cx="1078" cy="85" r="9" fill="#4ade80"/>
  <circle class="pulse" cx="1106" cy="85" r="9" fill="#fb7185"/>
</g>
<rect class="scan" x="72" y="0" width="1056" height="70" fill="#00f5d4" opacity=".06"/>

<g filter="url(#heavyGlow)">
  <circle class="pulse" cx="600" cy="150" r="82" fill="url(#pinkblue)" opacity=".92"/>
  <path d="M520 134 H680 M520 154 H680 M535 176 H665 M560 198 H640" stroke="#030014" stroke-width="8" opacity=".55"/>
</g>
<g filter="url(#glow)">
  <text class="glitchA" x="600" y="160" text-anchor="middle" font-size="52" font-weight="900" fill="#00f5d4" letter-spacing="4">ABDULLAH ELIAN</text>
  <text class="glitchB" x="604" y="164" text-anchor="middle" font-size="52" font-weight="900" fill="#fb7185" opacity=".55" letter-spacing="4">ABDULLAH ELIAN</text>
  <text x="600" y="208" text-anchor="middle" font-size="19" fill="#fef3c7" letter-spacing="3">SOFTWARE ENGINEER // FULL-STACK DEVELOPER</text>
  <text x="600" y="242" text-anchor="middle" font-size="16" fill="#facc15" letter-spacing="2">APIS · MICROSERVICES · DASHBOARDS · REAL-TIME SYSTEMS</text>
</g>
<g transform="translate(180 245)" filter="url(#glow)">
  <path d="M70 -58 C37 -42 34 0 62 15 C30 45 38 94 78 101 C118 94 126 45 94 15 C122 0 119 -42 86 -58 C82 -72 74 -72 70 -58 Z" fill="none" stroke="#facc15" stroke-width="4.5"/>
  <path d="M78 -58 L78 108" stroke="#fef3c7" stroke-width="2.5"/>
  <path class="string" d="M68 -42 L68 92" stroke="#00f5d4" stroke-width="1.5"/>
  <path class="string" d="M88 -42 L88 92" stroke="#fb7185" stroke-width="1.5"/>
  <g class="bow">
    <path d="M-8 20 L162 67" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
    <path d="M-2 11 L168 58" stroke="#00f5d4" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</g>
<g class="cube" filter="url(#glow)">
  <polygon points="835,170 930,132 1026,170 930,210" fill="#00f5d4" opacity=".12" stroke="#00f5d4" stroke-width="3"/>
  <polygon points="835,170 930,210 930,318 835,278" fill="#fb7185" opacity=".10" stroke="#fb7185" stroke-width="3"/>
  <polygon points="1026,170 930,210 930,318 1026,278" fill="#facc15" opacity=".10" stroke="#facc15" stroke-width="3"/>
</g>
<g transform="translate(190 320)" filter="url(#glow)">
  <rect x="0" y="0" width="820" height="66" rx="12" fill="#020617" opacity=".82" stroke="#38bdf8"/>
  <text x="24" y="27" font-size="17" fill="#4ade80" class="type1">&gt; INSERT COIN TO VIEW PROFILE</text>
  <text x="24" y="51" font-size="17" fill="#facc15" class="type2">&gt; BACKEND-HEAVY FULL-STACK SYSTEMS</text>
  <text x="520" y="51" font-size="17" fill="#00f5d4" class="type3">&gt; READY_TO_SHIP</text>
</g>

</svg>